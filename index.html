<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For My Love ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

html, body {
    height: 100%;
}

body {
    background: #ece5dd;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

/* ================= LOCK SCREEN ================= */

.lock-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100dvh;
    background: url('https://i.pinimg.com/1200x/6f/22/c5/6f22c589d2267d355faa056e3071c377.jpg') no-repeat center center;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    color: white;
    z-index: 100;
    text-align: center;
    padding: 40px 20px;
}

.lock-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    z-index: 1;
}

.lock-content, .clock {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
}

/* CLOCK */

.clock {
    margin-top: 60px;
}

.time {
    font-size: clamp(40px, 10vw, 60px);
    font-weight: 300;
    letter-spacing: 2px;
}

.date {
    font-size: 16px;
    opacity: 0.85;
    margin-top: 5px;
}

/* PASSCODE */

.lock-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
}

#passcodeDisplay {
    display: flex;
    justify-content: space-between;
    width: 160px;
}

.dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.5);
    background: transparent;
    transition: 0.3s ease;
}

.dot.filled {
    background: white;
    transform: scale(1.2);
}

/* KEYPAD */

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 100%;
    max-width: 280px;
}

.keypad button {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.keypad button:active {
    transform: scale(1.1);
}

/* ================= PHONE UI ================= */

.phone {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    background: #fff;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

@media (min-width: 500px) {
    .phone {
        border-radius: 25px;
        min-height: 95vh;
        max-height: 95vh;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
}

.header {
    background: #075e54;
    color: white;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.header img {
    width: 35px;
    height: 35px;
    border-radius: 50%;
}

/* CHAT */

.chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
}

.message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 15px;
    font-size: 14px;
    animation: fadeIn 0.3s ease-in;
    word-wrap: break-word;
}

.sent {
    align-self: flex-end;
    background: #dcf8c6;
}

.typing {
    font-style: italic;
    font-size: 13px;
    opacity: 0.7;
}

.buttons {
    padding: 12px;
    gap: 10px;
    background: #f0f0f0;
    position: relative;
    min-height: 70px;
    display: none; /* hidden initially */
    flex-direction: row;
}

button.choice {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s ease;
}

#yesBtn {
    background: #25d366;
    color: white;
    position: relative;
}

#noBtn {
    background: #ff4d4d;
    color: white;
    position: relative;
}

/* HEARTS */

.heart {
    position: fixed;
    bottom: -10px;
    animation: float 6s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0% { transform: translateY(0); opacity:1; }
    100% { transform: translateY(-120vh); opacity:0; }
}

@keyframes fadeIn {
    from { opacity:0; transform: translateY(5px); }
    to { opacity:1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div class="lock-screen" id="lockScreen">
    <div class="clock">
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
    </div>

    <div class="lock-content">
        <h2>Enter Passcode</h2>

        <div id="passcodeDisplay">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <div class="keypad">
            <button onclick="pressKey(1)">1</button>
            <button onclick="pressKey(2)">2</button>
            <button onclick="pressKey(3)">3</button>
            <button onclick="pressKey(4)">4</button>
            <button onclick="pressKey(5)">5</button>
            <button onclick="pressKey(6)">6</button>
            <button onclick="pressKey(7)">7</button>
            <button onclick="pressKey(8)">8</button>
            <button onclick="pressKey(9)">9</button>
            <button onclick="clearPasscode()">⌫</button>
            <button onclick="pressKey(0)">0</button>
            <button onclick="unlock()">✔</button>
        </div>
    </div>
</div>

<!-- PHONE UI -->
<div class="phone" id="phoneUI">
    <div class="header">
        <img src="image.jpg" alt="Profile">
        <div>My Man💕</div>
    </div>

    <div class="chat" id="chatBox"></div>

    <div class="buttons" id="choiceButtons">
        <button class="choice" id="yesBtn">YES 💖</button>
        <button class="choice" id="noBtn">No 😢</button>
    </div>
</div>

<audio id="bgMusic" src="Ruth B. - Dandelions (Lyrics).mp3" loop></audio>

<script>
const correctCode = "0517";
let enteredCode = "";

const lockScreen = document.getElementById("lockScreen");
const phoneUI = document.getElementById("phoneUI");
const bgMusic = document.getElementById("bgMusic");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const choiceButtons = document.getElementById("choiceButtons");
const chatBox = document.getElementById("chatBox");

/* LOCKSCREEN FUNCTIONS */

function updateClock() {
    const now = new Date();
    document.getElementById("time").textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

function pressKey(num){
    if(enteredCode.length < 4){
        enteredCode += num;
        updateDisplay();
    }
}

function clearPasscode(){
    enteredCode = enteredCode.slice(0, -1);
    updateDisplay();
}

function updateDisplay(){
    const dots = document.querySelectorAll(".dot");
    dots.forEach((dot, i) => {
        dot.classList.toggle("filled", i < enteredCode.length);
    });
}

function unlock() {
    if(enteredCode === correctCode){
        lockScreen.style.display = "none";
        phoneUI.style.display = "flex";
        bgMusic.play();
        startChat();
    } else {
        alert("Wrong code baby 😜");
        enteredCode = "";
        updateDisplay();
    }
}

/* CHAT */

const messages = [
    "Hi baby ❤️",
    "I have something important to tell you...",
    "Every day with you feels magical.",
    "You make my world brighter.",
    "So here's my question...",
    "Will you be my Valentine? 💘"
];

let index = 0;

function scrollBottom(){
    chatBox.scrollTop = chatBox.scrollHeight;
}

function startChat(){
    showTyping();
}

function showTyping(){
    const typing = document.createElement("div");
    typing.classList.add("typing");
    typing.innerText = "typing...";
    chatBox.appendChild(typing);
    scrollBottom();

    setTimeout(() => {
        typing.remove();
        showMessage();
    }, 1500);
}

function showMessage(){
    if(index < messages.length){
        const msg = document.createElement("div");
        msg.classList.add("message","sent");
        msg.innerText = messages[index];
        chatBox.appendChild(msg);
        scrollBottom();
        index++;
        setTimeout(showTyping, 1000);

        // Show buttons only after the last message
        if(index === messages.length){
            choiceButtons.style.display = "flex";
        }
    }
}

/* YES BUTTON */

yesBtn.onclick = function(){
    choiceButtons.style.display = "none";
    const msg = document.createElement("div");
    msg.classList.add("message","sent");
    msg.innerText = "YAAY BABY 💕 You just made me the happiest girlfriend alive. I love you more than words can explain. Thank you for always have time for me even when you're busy. Thank you for listening to my chika I hope you'll still listen more to my upcoming chikas hahaha. I wanna spend time with you personally like I can feel and touch you baby. I love you always my baby hubby eventhough I sometimes fight with you hahaha it's just me wanting some lambing hehehe. Anyways I love you so so much baby I really do I swear hahaha 💍❤️"
    chatBox.appendChild(msg);
    scrollBottom();
    launchHearts();
};

/* NO BUTTON RUNAWAY AFTER FIRST CLICK */

let noEscaped = false;

function moveButton(){
    if(!noEscaped){
        noBtn.style.position = "absolute";
        noEscaped = true;
    }

    const container = document.getElementById("choiceButtons");
    const maxX = container.clientWidth - noBtn.offsetWidth - 10;
    const maxY = container.clientHeight - noBtn.offsetHeight - 10;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

// Desktop: hover triggers move
noBtn.addEventListener("mouseenter", moveButton);

// Mobile: tap triggers move only on actual click
noBtn.addEventListener("click", function(e){
    e.preventDefault();
    moveButton();
});

/* HEARTS */

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20+15)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}

function launchHearts(){
    setInterval(createHeart,300);
}
</script>

</body>
</html>
